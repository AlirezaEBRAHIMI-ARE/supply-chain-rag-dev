name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 app_supply.py tracking.py

      - name: Run tests
        run: pytest test_app.py

      - name: Build Docker image
        run: docker build -t rag-supply-app .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag rag-supply-app ghcr.io/${{ github.repository_owner }}/rag-supply-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/rag-supply-app:latest