name: Build and push image to ECR

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Get temporary AWS credentials (OIDC, ECR role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::308087722552:role/github-actions-ecr
          aws-region: eu-west-3

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (lets an x86 machine build ARM images)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (ARM64, tagged with the commit ID)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/rag-supply-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
